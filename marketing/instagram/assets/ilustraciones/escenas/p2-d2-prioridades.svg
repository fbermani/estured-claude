<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img">
<title>Post 2, diapositiva 2: cinco prioridades</title>
<desc>Cinco íconos en fila sobre círculos arena: billete sin monto, reloj, cama, puerta y escritorio con lámpara. Debajo de cada uno queda lugar para su palabra.</desc>
<defs>
<filter id="papel" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
  <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.29  0 0 0 0 0.19  0 0 0 1.1 -0.48"/>
</filter>

</defs>
<style>
  .crema{fill:#fbf6ec}
  .forest{fill:#1f7d5c}
  .forest-osc{fill:#0c3a2c}
  .tinta{fill:#1d2722}
  .arena{fill:#f1d9a8}
  .arena-osc{fill:#e2c88f}
  .hoja{fill:#fffdf7}
  .sombra{fill:#e9dfc8}
  .barra{fill:#d9cba8}
  .menta{fill:#cfe5d9}
  .tilde{fill:none;stroke:#fbf6ec;stroke-linecap:round;stroke-linejoin:round}
  .linea-tinta{fill:none;stroke:#1d2722;stroke-linecap:round;stroke-linejoin:round}
  .linea-forest{fill:none;stroke:#1f7d5c;stroke-linecap:round;stroke-linejoin:round}
  .linea-crema{fill:none;stroke:#fbf6ec;stroke-linecap:round;stroke-linejoin:round}
  .vacio{fill:none;stroke:#b9a983;stroke-dasharray:10 8}

</style>
<rect id="fondo" class="crema" width="1080" height="1350"/>
<g id="icono-billete"><circle class="arena" cx="180" cy="860" r="80"/><rect class="forest" x="128" y="830" width="104" height="60" rx="8"/><circle class="arena" cx="180" cy="860" r="17"/><circle class="arena" cx="144" cy="845" r="5"/><circle class="arena" cx="216" cy="875" r="5"/></g><g id="icono-reloj"><circle class="arena" cx="360" cy="860" r="80"/><circle class="forest" cx="360" cy="860" r="46"/><circle class="crema" cx="360" cy="860" r="36"/><path class="linea-tinta" stroke-width="7" d="M360 838 V860 L376 870"/></g><g id="icono-cama"><circle class="arena" cx="540" cy="860" r="80"/><rect class="forest" x="486" y="826" width="12" height="70" rx="5"/><rect class="forest" x="490" y="862" width="104" height="24" rx="6"/><rect class="crema" x="500" y="846" width="30" height="16" rx="6"/><rect class="forest-osc" x="532" y="850" width="60" height="14" rx="5"/><rect class="forest" x="584" y="880" width="10" height="18" rx="3"/></g><g id="icono-puerta"><circle class="arena" cx="720" cy="860" r="80"/><rect class="forest-osc" x="686" y="808" width="68" height="104" rx="6"/><rect class="forest" x="694" y="816" width="52" height="96" rx="3"/><circle class="arena" cx="734" cy="866" r="6"/></g><g id="icono-escritorio"><circle class="arena" cx="900" cy="860" r="80"/><rect class="forest" x="844" y="862" width="112" height="12" rx="4"/><rect class="forest" x="850" y="872" width="10" height="38" rx="3"/><rect class="forest" x="940" y="872" width="10" height="38" rx="3"/><path class="linea-tinta" stroke-width="6" d="M928 862 L918 830 L934 814"/><path class="tinta" d="M926 802 L950 822 L944 828 Q930 824 924 812 Z"/><rect class="crema" x="860" y="838" width="40" height="24" rx="3"/></g>
<rect id="textura-papel" width="1080" height="1350" filter="url(#papel)" opacity="0.55"/>
</svg>
