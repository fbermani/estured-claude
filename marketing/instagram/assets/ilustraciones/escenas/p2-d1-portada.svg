<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img">
<title>Post 2, portada: E1 con laptop y checklist</title>
<desc>Fondo forest. E1 de pie mira su laptop sobre un círculo arena; a la izquierda, una tarjeta crema con tres casillas tildadas y renglones sin texto. Abajo a la derecha, botón de deslizar. Arriba queda libre para el titular.</desc>
