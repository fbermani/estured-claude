<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img">
<title>Celular con chats y fotos</title>
<desc>Primer plano del celular de E1: burbujas de chat genéricas sin texto y tres fotos de cuartos que se superponen. Cada burbuja y cada foto es un grupo aparte para animarlas.</desc>
<defs>
<filter id="papel" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
  <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.29  0 0 0 0 0.19  0 0 0 1.1 -0.48"/>
</filter>

</defs>
<style>
  .bg-fondo{fill:#e9dcc4}
  .bg-mano{fill:#b97a4f}
  .bg-celu{fill:#1d2722}
  .bg-pantalla{fill:#f4f1ea}
  .bg-burbuja-otro{fill:#e2dccf}
  .bg-burbuja-yo{fill:#cfe3d8}
  .bg-renglon{fill:#b9b1a2}
  .bg-renglon-yo{fill:#8fb9a3}
  .bg-foto{fill:#fbf6ec}
  .bg-foto-pared{fill:#e8d7b7}
  .bg-foto-pared2{fill:#d9e1d8}
  .bg-foto-pared3{fill:#efd2c0}
  .bg-foto-cama{fill:#c8ad85}
  .bg-foto-ventana{fill:#bcd3d6}
  .bg-sombra{fill:#1d2722;opacity:0.12}
</style>
<rect class="bg-fondo" width="1080" height="1920"/>
<g id="celular">
  <rect class="bg-celu" x="200" y="300" width="680" height="1340" rx="80"/>
  <rect class="bg-pantalla" x="230" y="340" width="620" height="1260" rx="56"/>
</g>
<g id="chats">
  <g id="chat-1"><rect class="bg-burbuja-otro" x="262" y="420" width="420" height="94" rx="26"/><rect class="bg-renglon" x="288" y="446" width="368" height="12" rx="6"/><rect class="bg-renglon" x="288" y="476" width="228" height="12" rx="6"/></g>
  <g id="chat-2"><rect class="bg-burbuja-yo" x="420" y="560" width="400" height="64" rx="26"/><rect class="bg-renglon-yo" x="446" y="586" width="216" height="12" rx="6"/></g>
  <g id="chat-3"><rect class="bg-burbuja-otro" x="262" y="650" width="460" height="124" rx="26"/><rect class="bg-renglon" x="288" y="676" width="408" height="12" rx="6"/><rect class="bg-renglon" x="288" y="706" width="408" height="12" rx="6"/><rect class="bg-renglon" x="288" y="736" width="253" height="12" rx="6"/></g>
  <g id="chat-4"><rect class="bg-burbuja-yo" x="390" y="830" width="430" height="94" rx="26"/><rect class="bg-renglon-yo" x="416" y="856" width="378" height="12" rx="6"/><rect class="bg-renglon-yo" x="416" y="886" width="234" height="12" rx="6"/></g>
  <g id="chat-5"><rect class="bg-burbuja-otro" x="262" y="980" width="360" height="64" rx="26"/><rect class="bg-renglon" x="288" y="1006" width="191" height="12" rx="6"/></g>
</g>
<g id="fotos-cuartos">
  <g id="foto-1" transform="rotate(-6 470 1150)">
  <rect class="bg-sombra" x="290" y="1024" width="372" height="270" rx="14"/>
  <rect class="bg-foto" x="284" y="1014" width="372" height="270" rx="14"/>
  <rect class="bg-foto-pared" x="302" y="1032" width="336" height="234" rx="6"/>
  <rect class="bg-foto-ventana" x="510" y="1058" width="92" height="96" rx="4"/>
  <rect class="bg-foto-cama" x="320" y="1170" width="200" height="60" rx="10"/>
  <rect class="bg-foto-cama" x="320" y="1140" width="36" height="90" rx="8"/>
</g>
  <g id="foto-2" transform="rotate(5 620 1290)">
  <rect class="bg-sombra" x="440" y="1164" width="372" height="270" rx="14"/>
  <rect class="bg-foto" x="434" y="1154" width="372" height="270" rx="14"/>
  <rect class="bg-foto-pared2" x="452" y="1172" width="336" height="234" rx="6"/>
  <rect class="bg-foto-ventana" x="660" y="1198" width="92" height="96" rx="4"/>
  <rect class="bg-foto-cama" x="470" y="1310" width="200" height="60" rx="10"/>
  <rect class="bg-foto-cama" x="470" y="1280" width="36" height="90" rx="8"/>
</g>
  <g id="foto-3" transform="rotate(-3 500 1420)">
  <rect class="bg-sombra" x="320" y="1294" width="372" height="270" rx="14"/>
  <rect class="bg-foto" x="314" y="1284" width="372" height="270" rx="14"/>
  <rect class="bg-foto-pared3" x="332" y="1302" width="336" height="234" rx="6"/>
  <rect class="bg-foto-ventana" x="540" y="1328" width="92" height="96" rx="4"/>
  <rect class="bg-foto-cama" x="350" y="1440" width="200" height="60" rx="10"/>
  <rect class="bg-foto-cama" x="350" y="1410" width="36" height="90" rx="8"/>
</g>
</g>
<g id="mano">
  <path class="bg-mano" d="M160 1500 Q150 1400 206 1360 L240 1420 Q250 1560 200 1700 L120 1920 L0 1920 L0 1760 Z"/>
  <rect class="bg-mano" x="840" y="1180" width="90" height="56" rx="28"/>
  <rect class="bg-mano" x="848" y="1250" width="86" height="54" rx="27"/>
</g>
<rect id="textura-papel" width="1080" height="1920" filter="url(#papel)" opacity="0.55"/>
</svg>
