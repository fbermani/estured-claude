  .e1-piel-sombra{fill:#a4683f}
  .e1-pelo{fill:#2a1d17}
  .e1-tinta{fill:#1d2722}
  .e1-trazo{fill:none;stroke:#1d2722;stroke-linecap:round}
  .e1-abrigo{fill:#1f7d5c}
  .e1-abrigo-brazo{fill:none;stroke:#1a6e51;stroke-linecap:round}
  .e1-abrigo-brazo-lejos{fill:none;stroke:#155c44;stroke-linecap:round}
  .e1-abrigo-linea{fill:none;stroke:#0c3a2c;stroke-linecap:round}
  .e1-cuello{fill:#0c3a2c}
  .e1-pantalon{fill:#2f3b45}
