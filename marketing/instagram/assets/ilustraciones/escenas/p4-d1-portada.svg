  .e1-valija-manija{fill:#14503c}
  .e1-valija-banda{fill:#f1d9a8}
  .laptop-tapa{fill:#5d666b}
  .laptop-canto{fill:#465055}
  .laptop-base{fill:#7b8489}
  .celular-dorso{fill:#1d2722}
  .celular-camara{fill:#465055}

</style>
<rect id="fondo" class="forest" width="1080" height="1350"/>
<circle id="escenario" class="arena" cx="728" cy="1010" r="260"/><g id="cinco-pasos"><path class="linea-crema" stroke-width="10" stroke-dasharray="2 22" d="M150 1210 250 1060 180 900 300 760 440 660"/><circle class="crema" cx="150" cy="1210" r="30"/><circle class="arena" cx="150" cy="1210" r="14"/><circle class="crema" cx="250" cy="1060" r="30"/><circle class="arena" cx="250" cy="1060" r="14"/><circle class="crema" cx="180" cy="900" r="30"/><circle class="arena" cx="180" cy="900" r="14"/><circle class="crema" cx="300" cy="760" r="30"/><circle class="arena" cx="300" cy="760" r="14"/><circle class="arena" cx="440" cy="660" r="44"/><path class="linea-forest" stroke-width="9" d="M422 661 L435 674 L459 648"/></g><g id="e1" transform="translate(314 478) scale(0.69)">

