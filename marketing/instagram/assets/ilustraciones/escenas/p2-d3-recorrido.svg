<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img">
<title>Post 2, diapositiva 3: dos recorridos</title>
<desc>Plano de barrio sin nombres: desde una casa (pin forest) salen dos recorridos distintos hasta una sede universitaria sin nombre; uno en línea forest con ícono de colectivo y otro punteado en tinta con ícono de subte.</desc>
<defs>
<filter id="papel" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
  <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.29  0 0 0 0 0.19  0 0 0 1.1 -0.48"/>
</filter>

</defs>
<style>
  .crema{fill:#fbf6ec}
  .forest{fill:#1f7d5c}
  .forest-osc{fill:#0c3a2c}
  .tinta{fill:#1d2722}
  .arena{fill:#f1d9a8}
  .arena-osc{fill:#e2c88f}
  .hoja{fill:#fffdf7}
  .sombra{fill:#e9dfc8}
  .barra{fill:#d9cba8}
  .menta{fill:#cfe5d9}
  .tilde{fill:none;stroke:#fbf6ec;stroke-linecap:round;stroke-linejoin:round}
  .linea-tinta{fill:none;stroke:#1d2722;stroke-linecap:round;stroke-linejoin:round}
  .linea-forest{fill:none;stroke:#1f7d5c;stroke-linecap:round;stroke-linejoin:round}
  .linea-crema{fill:none;stroke:#fbf6ec;stroke-linecap:round;stroke-linejoin:round}
  .vacio{fill:none;stroke:#b9a983;stroke-dasharray:10 8}
  .calle-fondo{fill:#efe5cf}
  .arbol{fill:#5fa883}
</style>
<rect id="fondo" class="crema" width="1080" height="1350"/>
