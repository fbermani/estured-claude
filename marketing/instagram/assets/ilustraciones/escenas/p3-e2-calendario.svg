  <rect class="bg-valija" x="-22" y="-112" width="12" height="44" rx="4"/>
  <rect class="bg-valija" x="10" y="-112" width="12" height="44" rx="4"/>
  <rect class="bg-valija" x="-30" y="-120" width="60" height="16" rx="8"/>
  <rect class="bg-valija" x="-50" y="-76" width="100" height="160" rx="18"/>
