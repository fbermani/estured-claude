<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img">
<title>Calendario sin margen</title>
<desc>Calendario sin números con dos días seguidos marcados y unidos: el de llegada, con una valija, y el primer día de clases, con un libro. Encima se apilan tres íconos: valija, trámite y cansancio (batería baja). Cada ícono es un grupo aparte para animarlo.</desc>
<defs>
<filter id="papel" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
  <feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.29  0 0 0 0 0.19  0 0 0 1.1 -0.48"/>
</filter>

</defs>
<style>
  .bg-fondo{fill:#fbf6ec}
  .bg-hoja{fill:#ffffff}
  .bg-hoja-sombra{fill:#1d2722;opacity:0.08}
  .bg-cabecera{fill:#0c3a2c}
  .bg-anillo{fill:#d9cdb5}
  .bg-anillo-agujero{fill:#fbf6ec}
  .bg-celda{fill:#f3ede1}
  .bg-celda-llegada{fill:#cfe3d8}
  .bg-celda-clase{fill:#f1d9a8}
  .bg-une{fill:none;stroke:#1f7d5c;stroke-linejoin:round}
  .bg-valija{fill:#0c3a2c}
  .bg-valija-banda{fill:#f1d9a8}
  .bg-valija-rueda{fill:#1d2722}
  .bg-libro{fill:#c29a55}
  .bg-libro-hojas{fill:#fbf6ec}
  .bg-icono{fill:#fbf6ec}
  .bg-icono-borde{fill:#1d2722}
  .bg-papel-tramite{fill:#fbf6ec}
  .bg-renglon{fill:#c9bfae}
  .bg-sello-tramite{fill:none;stroke:#c0603f}
  .bg-bateria{fill:none;stroke:#1d2722;stroke-linejoin:round}
  .bg-bateria-baja{fill:#c0603f}
  .bg-sombra-icono{fill:#1d2722;opacity:0.10}
</style>
<rect class="bg-fondo" width="1080" height="1920"/>
<g id="calendario">
