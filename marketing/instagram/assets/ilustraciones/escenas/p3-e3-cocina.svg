<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img">
<title>Cocina común</title>
<desc>Cocina común de la residencia, ordenada: alacenas, azulejos, mesada, ventana con planta y heladera. Fondo para el saludo de E1 y E2 y para la charla con R1 (post 3, escenas 3 y 4).</desc>
