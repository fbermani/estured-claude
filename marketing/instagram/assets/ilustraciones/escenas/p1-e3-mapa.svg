<title>Mapa de la distancia</title>
<desc>Mapa simple de Argentina con Malvinas y una línea punteada desde una provincia del norte, sin nombrar, hasta Buenos Aires; un reloj junto al origen y una valija junto a la ciudad. Ruta, reloj y valija son grupos aparte para animarlos.</desc>
