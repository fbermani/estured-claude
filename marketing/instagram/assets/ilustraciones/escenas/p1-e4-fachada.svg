<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img">
<title>Fachada de residencia</title>
<desc>Frente genérico de una residencia de tres pisos, sin nombre ni número, con árbol en la vereda. Sobre la puerta, el sello de la casa del logo con un tilde. Una persona del equipo, en silueta y con una carpeta, camina hacia la entrada. Sello y persona son grupos aparte para animarlos.</desc>
