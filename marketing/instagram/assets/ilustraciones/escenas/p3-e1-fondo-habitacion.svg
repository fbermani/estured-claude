  <rect class="bg-colchon" x="690" y="1120" width="440" height="66" rx="20"/>
  <rect class="bg-almohada" x="1000" y="1072" width="120" height="58" rx="24" transform="rotate(8 1060 1100)"/>
  <path class="bg-frazada" d="M680 1142 Q760 1100 850 1134 Q920 1158 980 1126 L1000 1200 Q840 1246 676 1220 Z"/>
  <path class="bg-frazada-pliegue" d="M740 1154 Q820 1142 900 1170 L896 1182 Q820 1158 744 1168 Z"/>
