</g>
<rect id="textura-papel" width="1080" height="1920" filter="url(#papel)" opacity="0.55"/>
<g id="personajes" transform="translate(0 440) scale(0.9)">


<ellipse class="piso" cx="640" cy="1114" rx="460" ry="22"/>

