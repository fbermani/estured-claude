<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>R1 master</title>
<desc>Responsable de residencia R1 de EstuRed en pose neutra, de frente y en tres cuartos: pelo corto entrecano, barba corta, camisa celeste con mangas arremangadas, pantalón oscuro y una carpeta bajo el brazo.</desc>
<style>
  .fondo{fill:#fbf6ec}
  .piso{fill:#ece3cf}
  .piel{fill:#c98b62}
  .piel-sombra{fill:#b37750}
  .pelo{fill:#6b625c}
  .barba{fill:#5c544e}
  .tinta{fill:#1d2722}
  .trazo{fill:none;stroke:#1d2722;stroke-linecap:round}
  .camisa{fill:#9fbcd0}
  .camisa-oscura{fill:#87a6bc}
  .camisa-brazo{fill:none;stroke:#93b2c7;stroke-linecap:round;stroke-linejoin:round}
  .camisa-brazo-lejos{fill:none;stroke:#7f9db2;stroke-linecap:round;stroke-linejoin:round}
  .arremangado{fill:none;stroke:#b6cddc;stroke-linecap:round}
  .antebrazo{fill:none;stroke:#c98b62;stroke-linecap:round}
  .antebrazo-lejos{fill:none;stroke:#b37750;stroke-linecap:round}
  .cuello-camisa{fill:#b6cddc}
  .linea{fill:none;stroke:#7895aa;stroke-linecap:round}
  .cinturon{fill:#3a2a20}
  .pantalon{fill:#3d3a36}
  .pantalon-lejos{fill:#33302d}
  .zapato{fill:#5a3d2b}
  .carpeta{fill:#2f6b5a}
  .carpeta-hoja{fill:#f3ead8}
</style>

<rect class="fondo" width="1600" height="1200"/>

