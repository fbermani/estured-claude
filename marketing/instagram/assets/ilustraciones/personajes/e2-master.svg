<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>E2 master</title>
<desc>Compañera de residencia E2 de EstuRed en pose neutra, de frente y en tres cuartos: cola de caballo alta, buzo con capucha terracota, auriculares al cuello, pantalón ancho y zapatillas claras.</desc>
<style>
  .fondo{fill:#fbf6ec}
  .piso{fill:#ece3cf}
  .piel{fill:#8a5638}
  .piel-sombra{fill:#764830}
  .pelo{fill:#1a1412}
  .gomita{fill:#c0603f}
  .tinta{fill:#1d2722}
  .trazo{fill:none;stroke:#1d2722;stroke-linecap:round}
  .buzo{fill:#c0603f}
  .buzo-oscuro{fill:#a44f33}
  .buzo-brazo{fill:none;stroke:#b3583a;stroke-linecap:round;stroke-linejoin:round}
  .buzo-brazo-lejos{fill:none;stroke:#9c4b31;stroke-linecap:round;stroke-linejoin:round}
  .punio{fill:none;stroke:#a44f33}
  .cordon{fill:none;stroke:#f3ead8;stroke-linecap:round}
  .auriculares{fill:none;stroke:#1d2722;stroke-linecap:round}
  .auricular{fill:#1d2722}
  .pantalon{fill:#a8946e}
  .pantalon-lejos{fill:#958260}
  .zapatilla{fill:#f3ead8}
  .suela{fill:#1d2722}
</style>

<rect class="fondo" width="1600" height="1200"/>

