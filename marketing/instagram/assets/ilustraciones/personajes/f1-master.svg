<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>F1 master</title>
<desc>Familiar F1 de EstuRed en pose neutra, de frente y en tres cuartos: melena lacia con flequillo y canas, anteojos redondos, cárdigan gris azulado sobre remera crema y un mate en la mano.</desc>
<style>
  .fondo{fill:#fbf6ec}
  .piso{fill:#ece3cf}
  .piel{fill:#d39a72}
  .piel-sombra{fill:#be8460}
  .pelo{fill:#4a3a30}
  .canas{fill:none;stroke:#a3958a;stroke-linecap:round}
  .tinta{fill:#1d2722}
  .trazo{fill:none;stroke:#1d2722;stroke-linecap:round}
  .anteojos{fill:none;stroke:#1d2722;stroke-width:4}
  .cardigan{fill:#6f8290}
  .cardigan-brazo{fill:none;stroke:#637583;stroke-linecap:round;stroke-linejoin:round}
  .cardigan-brazo-lejos{fill:none;stroke:#566773;stroke-linecap:round;stroke-linejoin:round}
  .cardigan-borde{fill:none;stroke:#4e5f6b;stroke-linecap:round}
  .remera{fill:#f3ead8}
  .boton{fill:#f3ead8}
  .punio{fill:none;stroke:#566773}
  .pantalon{fill:#5a4a42}
  .pantalon-lejos{fill:#4d3f38}
  .zapato{fill:#3d2f29}
  .mate{fill:#8a5a3c}
  .bombilla{fill:none;stroke:#c9c2b5;stroke-linecap:round}
</style>

<rect class="fondo" width="1600" height="1200"/>

