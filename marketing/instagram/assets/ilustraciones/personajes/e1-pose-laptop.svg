<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
<title>E1 con la laptop</title>
<desc>E1 de tres cuartos, de pie y con la mochila puesta, sostiene una laptop abierta con un brazo y la mira con la cabeza un poco inclinada; de la laptop solo se ve el dorso de la tapa.</desc>
